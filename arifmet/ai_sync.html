<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Sync Panel 🤖</title>
    <style>
        body { margin: 0; padding: 20px; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 13px; line-height: 1.5; }
        .status { color: #f59e0b; margin-bottom: 20px; font-weight: bold; }
        pre { white-space: pre-wrap; word-break: break-all; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; color: #cbd5e1; }
    </style>
</head>
<body>
    <div id="status" class="status">⏳ Сборка репозитория для ИИ... Пожалуйста, подождите.</div>
    <pre id="output">Сканирование файлов проекта...</pre>

    <script type="module">
        const FILES = [
            'index_arifmet.html', 'style_arifmet.css', 'js/main.js', 'js/state.js',
            'js/calculator.js', 'js/feedback.js', 'js/game_canvas.js', 'js/view_dispatcher.js',
            'js/menu.js', 'js/numpad.js', 'js/tens.js', 'js/mix.js', 'js/multiplication.js',
            'js/addition_visual.js', 'js/subtraction_visual.js', 'js/addition_hundreds_visual.js',
            'js/subtraction_hundreds_visual.js', 'js/project_map.js', 'js/map_scanner.js', 'ai_sync.html'
        ];

        async function buildBundle() {
            let out = `==================================================\n`;
            out += `=== ARIFMET FULL REPOSITORY SOURCE BUNDLE ===\n`;
            out += `=== GENERATED: ${new Date().toISOString()} ===\n`;
            out += `==================================================\n\n[AI RECONSTRUCTION MANIFEST]\n`;
            
            const tStamp = Date.now();
            for (const p of FILES) {
                try {
                    const r = await fetch(`${p}?cb=${tStamp}`, { cache: "no-store" }); if (!r.ok) continue;
                    const t = await r.text();
                    const m = t.match(/(?:\/\/|\/\*|<!--)\s*version:\s*([^\s\*\/]+)/i);
                    const v = m ? m[0].replace(/-->/g, '').trim() : 'unknown';
                    out += `- PATH: "${p}" | VER: ${v} | SIZE: ${t.length} chars\n`;
                } catch { out += `- PATH: "${p}" | NOT_FOUND ❌\n`; }
            }
            out += `\n=== END OF MANIFEST ===\n\n`;

            for (const p of FILES) {
                try {
                    const r = await fetch(`${p}?cb=${tStamp}`, { cache: "no-store" }); if (!r.ok) continue;
                    out += `=== FILE_START: "${p}" ===\n${await r.text()}\n=== FILE_END: "${p}" ===\n\n`;
                } catch { out += `=== FILE_START: "${p}" ===\n// NOT_FOUND\n=== FILE_END: "${p}" ===\n\n`; }
            }
            document.getElementById('status').innerText = '✅ Сборка завершена! Страница готова для чтения ИИ.';
            document.getElementById('output').innerText = out;
        }
        buildBundle();
    </script>
</body>
</html>
