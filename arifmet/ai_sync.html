<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Sync Panel 🤖</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: monospace; }
        .container { display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; padding: 15px; }
        .header { color: #22c55e; margin-bottom: 10px; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .sync-area { flex-grow: 1; width: 100%; background: #1e293b; color: #cbd5e1; padding: 15px; font-family: monospace; font-size: 13px; line-height: 1.5; border: 1px solid #334155; border-radius: 8px; resize: none; box-sizing: border-box; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status-msg" class="header">⏳ Синхронизация с ИИ: Собираю монолит проекта... Пожалуйста, подождите.</div>
        <textarea id="ai-bundle-field" class="sync-area" readonly></textarea>
    </div>

    <script type="module">
        async function buildProjectMapForAI() {
            const status = document.getElementById('status-msg');
            const area = document.getElementById('ai-bundle-field');
            
            const files = [
                './index_arifmet.html', './style_arifmet.css', './js/main.js', './js/state.js',
                './js/calculator.js', './js/feedback.js', './js/game_canvas.js', './js/view_dispatcher.js',
                './js/menu.js', './js/numpad.js', './js/tens.js', './js/mix.js', './js/multiplication.js',
                './js/addition_visual.js', './js/subtraction_visual.js', './js/project_map.js',
                './js/addition_hundreds_visual.js', './js/subtraction_hundreds_visual.js'
            ];
            
            let manifest = `[AI RECONSTRUCTION MANIFEST]\n`;
            let sources = ``;
            const tStamp = Date.now();

            for (const p of files) {
                try {
                    const r = await fetch(`${p}?cb=${tStamp}`, { cache: "no-store" });
                    if (!r.ok) {
                        manifest += `- PATH: "\${p.replace('./', '')}" | NOT_FOUND ❌\n`;
                        continue;
                    }
                    const t = await r.text();
                    const cleanPath = p.replace('./', '');
                    manifest += `- PATH: "\${cleanPath}" | SIZE: \${t.length} chars\n`;
                    sources += `=== FILE_START: "\${cleanPath}" ===\n\${t}\n=== FILE_END: "\${cleanPath}" ===\n\n`;
                } catch {
                    const cleanPath = p.replace('./', '');
                    manifest += `- PATH: "\${cleanPath}" | ERROR ❌\n`;
                }
            }

            area.value = `==================================================
=== ARIFMET FULL REPOSITORY SOURCE BUNDLE (STATIC) ===
==================================================

\${manifest}
\${sources}`;

            status.textContent = '✅ Автоматическая сборка монолита завершена! Весь код проекта готов для чтения ИИ.';
        }

        // Запуск сборки сразу при загрузке страницы в браузере
        window.addEventListener('DOMContentLoaded', buildProjectMapForAI);
    </script>
</body>
</html>
