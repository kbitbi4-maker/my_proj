<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сложение и вычитание</title>
    <link rel="stylesheet" href="style_arifmet.css">
</head>
<body>

    <div class="header">
        <a href="../index.html" title="Главное меню">←</a>
        <div class="header-title" onclick="toggleMenu()">Режим: Выбрать ▼</div>
        <div class="version">arifmet_010</div>
    </div>

    <div id="menu" class="dropdown">
        <div class="dropdown-item" onclick="setMode('tens')">Десятки</div>
        <div class="dropdown-item" onclick="setMode('hundreds')">Сотни</div>
        <div class="dropdown-item" onclick="setMode('thousands')">Тысячи</div>
    </div>

    <div class="main-container">
        <div class="left-area" id="examples-list">
            <div style="color: #999; text-align: center; margin-top: 20px;">Выберите режим в меню для начала игры</div>
        </div>
        
        <div class="right-area">
            <div class="numpad">
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>
                <button class="num-btn" onclick="pressNum('4')">4</button>
                <button class="num-btn" onclick="pressNum('5')">5</button>
                <button class="num-btn" onclick="pressNum('6')">6</button>
                <button class="num-btn" onclick="pressNum('7')">7</button>
                <button class="num-btn" onclick="pressNum('8')">8</button>
                <button class="num-btn" onclick="pressNum('9')">9</button>
                <button class="num-btn clear" onclick="pressNum('C')">C</button>
                <button class="num-btn" onclick="pressNum('0')">0</button>
                <button class="num-btn clear" onclick="pressNum('D')">←</button>
                <button class="num-btn op" onclick="pressNum('+')">+</button>
                <button class="num-btn op" onclick="pressNum('-')">-</button>
                <button class="num-btn op" onclick="pressNum('=')">=</button>
                <button class="num-btn next" onclick="confirmAndNext()">Следующий пример</button>
            </div>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const examplesList = document.getElementById('examples-list');
        
        let currentMode = '';
        let isAddition = true; 
        let examplesHistory = [];
        let activeIndex = -1;

        function toggleMenu() { menu.classList.toggle('active'); }

        function setMode(mode) {
            menu.classList.remove('active');
            if (mode === 'hundreds' || mode === 'thousands') { alert("Режим в разработке 🛠️"); return; }
            currentMode = mode;
            isAddition = true; 
            examplesHistory = [];
            activeIndex = -1;
            document.querySelector('.header-title').innerText = 'Режим: ' + (mode === 'tens' ? 'Десятки' : 'Выбрать') + ' ▼';
            examplesList.innerHTML = '';
            generateExample();
        }

        function generateExample() {
            if (currentMode !== 'tens') return;
            let num1, num2, correctValue, text;
            
            if (isAddition) {
                while (true) {
                    num1 = Math.floor(Math.random() * 90) + 10;
                    num2 = Math.floor(Math.random() * 90) + 10;
                    if ((num1 % 10 + num2 % 10) > 10 && (num1 + num2) < 100) {
                        text = `${num1}+${num2}`;
                        correctValue = num1 + num2;
                        break;
                    }
                }
            } else {
                while (true) {
                    num1 = Math.floor(Math.random() * 90) + 10;
                    num2 = Math.floor(Math.random() * 90) + 10;
                    if (num1 > num2 && (num2 % 10) >= (num1 % 10 + 1) && (num1 - num2) >= 1) {
                        text = `${num1}-${num2}`;
                        correctValue = num1 - num2;
                        break;
                    }
                }
            }
            
            examplesHistory.push({
                exampleText: text,
                correctValue: correctValue,
                currentInput: ''
            });
            
            activeIndex = examplesHistory.length - 1;
            isAddition = !isAddition;
            
            renderAllLines();
        }

        function evaluateExpr(str) {
            try {
                const cleaned = str.replace(/[^0-9+-]/g, '');
                if (!cleaned) return null;
                return Function('"use strict"; return (' + cleaned + ')')();
            } catch (e) {
                return null;
            }
        }

        function renderAllLines() {
            const placeholder = examplesList.querySelector('div[style*="color: #999"]');
            if (placeholder) placeholder.remove();
            
            examplesList.innerHTML = '';
            
            examplesHistory.forEach((item, index) => {
                const line = document.createElement('div');
                line.className = `example-line ${index === activeIndex ? 'active' : ''}`;
                line.onclick = () => selectExample(index);
                
                let parts = item.currentInput.split('=');
                let html = `<span>${item.exampleText}</span>`;
                
                let simText = parts[0] || '';
                let finText = parts[1] || '';
                
                // 1. Блок упрощения
                if (item.currentInput.includes('=')) {
                    let simVal = evaluateExpr(simText);
                    let simCorrect = (simVal === item.correctValue);
                    html += ` = <span class="block ${simCorrect ? 'block-correct' : 'block-incorrect'}">${simText || '?'}</span>`;
                } else {
                    html += ` = <span class="block">${simText || '_'}</span>`;
                }
                
                // 2. Блок ответа
                if (parts.length > 1) {
                    let finVal = evaluateExpr(finText);
                    let finCorrect = (finVal === item.correctValue);
                    
                    let isTwoDigits = /^[0-9]{2,}$/.test(finText.trim());
                    
                    if (isTwoDigits || finText.trim() === String(item.correctValue)) {
                        html += ` = <span class="block ${finCorrect ? 'block-correct' : 'block-incorrect'}">${finText}</span>`;
                    } else if (finText.length > 0) {
                        html += ` = <span class="block">${finText}</span>`;
                    } else {
                        html += ` = <span class="block">_</span>`;
                    }
                }
                
                line.innerHTML = html;
                examplesList.appendChild(line);
            });
            
            const activeElem = examplesList.querySelector('.active');
            if (activeElem) activeElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function selectExample(index) {
            activeIndex = index;
            renderAllLines();
        }

        function pressNum(n) {
            if (activeIndex === -1) return;
            
            let activeItem = examplesHistory[activeIndex];
            
            if (n === 'C') {
                activeItem.currentInput = '';
            } else if (n === 'D') {
                activeItem.currentInput = activeItem.currentInput.slice(0, -1);
            } else {
                let parts = activeItem.currentInput.split('=');
                if (n === '=' && parts.length >= 2) return;
                activeItem.currentInput += n;
            }
            
            renderAllLines();
        }

        function confirmAndNext() {
            generateExample();
        }
    </script>
</body>
</html>
