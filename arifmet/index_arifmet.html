<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сложение и вычитание</title>
    <link rel="stylesheet" href="style_arifmet.css">
</head>
<body>

    <div class="header">
        <a href="../index.html" title="Главное меню">←</a>
        <div class="version">arifmet_054</div>
        <div class="header-menu-btn" id="menu-toggle-btn">Режим: Выбрать ▼</div>
    </div>

    <div class="main-container" style="display: flex; flex-direction: column; position: relative; height: calc(100vh - 9.6vh); width: 100%;">
        <div style="display: flex; width: 100%; height: 68%;">
            <div class="left-area" id="examples-list" style="width: 66.6%; height: 100%;">
                <div id="history-placeholder" style="color: #999; text-align: center; margin-top: 20px;">Выберите режим в меню для начала игры</div>
            </div>
            
            <div class="right-area">
                <div class="numpad" id="main-numpad">
                    <!-- Кнопки выбора режимов -->
                    <button class="num-btn mode-btn" style="display:none;" data-mode="tens">Десятки 🟢</button>
                    <button class="num-btn mode-btn" style="display:none;" data-mode="multiplication">Умножение 🍕 🟡</button>
                    <button class="num-btn mode-btn" style="display:none;" data-mode="mix">Микс 🎰 🍒</button>
                    <button class="num-btn mode-btn" style="display:none;" data-mode="hundreds">Сотни 🛠️ 🔵</button>

                    <!-- Цифровой калькулятор -->
                    <button class="num-btn calc-btn" data-key="1">1</button>
                    <button class="num-btn calc-btn" data-key="2">2</button>
                    <button class="num-btn calc-btn" data-key="3">3</button>
                    <button class="num-btn calc-btn" data-key="4">4</button>
                    <button class="num-btn calc-btn" data-key="5">5</button>
                    <button class="num-btn calc-btn" data-key="6">6</button>
                    <button class="num-btn calc-btn" data-key="7">7</button>
                    <button class="num-btn calc-btn" data-key="8">8</button>
                    <button class="num-btn calc-btn" data-key="9">9</button>
                    <button class="num-btn calc-btn clear" data-key="C">C</button>
                    <button class="num-btn calc-btn" data-key="0">0</button>
                    <button class="num-btn calc-btn clear" data-key="D">←</button>
                    <button class="num-btn calc-btn op" data-key="+">+</button>
                    <button class="num-btn calc-btn op" data-key="-">-</button>
                    <button class="num-btn calc-btn op" data-key="=">=</button>
                    <button class="num-btn calc-btn next" id="next-example-btn">Следующий пример</button>
                </div>
            </div>
        </div>

        <div id="game-zone" style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; width: 100%; height: 32%; background-color: #f0fdf4; border-top: 2px dashed #4ade80; box-shadow: inset 0 4px 6px rgba(0,0,0,0.02); box-sizing: border-box; padding: 10px; overflow-y: auto;"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
