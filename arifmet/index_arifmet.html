<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сложение и вычитание</title>
    <link rel="stylesheet" href="style_arifmet.css">
</head>
<body>

    <div class="header">
        <a href="../index.html" title="Главное меню">←</a>
        <div class="header-title" onclick="toggleMenu()">Режим: Выбрать ▼</div>
        <div class="version">arifmet_032</div>
    </div>

    <div id="menu" class="dropdown">
        <div class="dropdown-item" onclick="setMode('tens')">Десятки</div>
        <div class="dropdown-item" onclick="setMode('hundreds')">Сотни</div>
        <div class="dropdown-item" onclick="setMode('thousands')">Тысячи</div>
        <!-- Новый пункт меню для мини-игры -->
        <div class="dropdown-item" onclick="setMode('multiplication')">Умножение 🍕</div>
    </div>

    <!-- Перестроили контейнер в вертикальную структуру Flexbox -->
    <div class="main-container" style="display: flex; flex-direction: column; gap: 20px; min-height: calc(100vh - 80px); box-sizing: border-box; padding: 15px;">
        
        <!-- ВЕРХНИЙ ЭТАЖ: Примеры слева, Нумпад справа -->
        <div style="display: flex; gap: 20px; flex: 1;">
            
            <!-- ЛЕВАЯ ОБЛАСТЬ: Только чистый список примеров -->
            <div class="left-area" id="examples-list" style="flex: 1; overflow-y: auto;">
                <div style="color: #999; text-align: center; margin-top: 20px;">Выберите режим в меню для начала игры</div>
            </div>
            
            <!-- ПРАВАЯ ОБЛАСТЬ: Нумпад -->
            <div class="right-area" style="box-sizing: border-box;">
                <div class="numpad">
                    <button class="num-btn" onclick="pressNum('1')">1</button>
                    <button class="num-btn" onclick="pressNum('2')">2</button>
                    <button class="num-btn" onclick="pressNum('3')">3</button>
                    <button class="num-btn" onclick="pressNum('4')">4</button>
                    <button class="num-btn" onclick="pressNum('5')">5</button>
                    <button class="num-btn" onclick="pressNum('6')">6</button>
                    <button class="num-btn" onclick="pressNum('7')">7</button>
                    <button class="num-btn" onclick="pressNum('8')">8</button>
                    <button class="num-btn" onclick="pressNum('9')">9</button>
                    <button class="num-btn clear" onclick="pressNum('C')">C</button>
                    <button class="num-btn" onclick="pressNum('0')">0</button>
                    <button class="num-btn clear" onclick="pressNum('D')">←</button>
                    <button class="num-btn op" onclick="pressNum('+')">+</button>
                    <button class="num-btn op" onclick="pressNum('-')">-</button>
                    <button class="num-btn op" onclick="pressNum('=')">=</button>
                    <button class="num-btn next" onclick="confirmAndNext()">Следующий пример</button>
                </div>
            </div>
        </div>

        <!-- НИЖНИЙ ЭТАЖ: Огромная выделенная область для игры, отличная по фону -->
        <div id="game-zone" style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; padding: 25px; background-color: #f0fdf4; border: 3px dashed #4ade80; border-radius: 16px; box-shadow: inset 0 4px 6px rgba(0,0,0,0.02); min-height: 160px; width: 100%; box-sizing: border-box;"></div>
    </div>

    <!-- Подключаем логику в правильном порядке перед закрытием body -->
    <script src="js/menu.js"></script>
    <script src="js/main.js"></script>
    <script src="js/multiplication.js"></script>
</body>
</html>
