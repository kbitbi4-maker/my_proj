<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сложение и вычитание</title>
    <link rel="stylesheet" href="style_arifmet.css">
</head>
<body>

    <div class="header">
        <a href="../index.html" title="Главное меню">←</a>
        <div class="version">arifmet_054</div>
        <div class="header-menu-btn" id="menu-toggle-btn">Режим: Выбрать ▼</div>
    </div>

    <div class="main-container">
        <div class="workspace-area">
            <div class="left-area" id="examples-list">
                <div id="history-placeholder" class="placeholder">Выберите режим в меню для начала игры</div>
            </div>
            
            <div class="right-area">
                <div id="modes-menu-container">
                    <button class="mode-btn" data-mode="tens">Десятки 🟢</button>
                    <button class="mode-btn" data-mode="multiplication">Умножение 🍕 🟡</button>
                    <button class="mode-btn" data-mode="mix">Микс 🎰 🍒</button>
                    <button class="mode-btn" data-mode="hundreds">Сотни 🛠️ 🔵</button>
                </div>

                <div class="numpad" id="calc-numpad-container">
                    <button class="num-btn calc-btn" data-key="1">1</button>
                    <button class="num-btn calc-btn" data-key="2">2</button>
                    <button class="num-btn calc-btn" data-key="3">3</button>
                    <button class="num-btn calc-btn" data-key="4">4</button>
                    <button class="num-btn calc-btn" data-key="5">5</button>
                    <button class="num-btn calc-btn" data-key="6">6</button>
                    <button class="num-btn calc-btn" data-key="7">7</button>
                    <button class="num-btn calc-btn" data-key="8">8</button>
                    <button class="num-btn calc-btn" data-key="9">9</button>
                    <button class="num-btn calc-btn clear" data-key="C">C</button>
                    <button class="num-btn calc-btn" data-key="0">0</button>
                    <button class="num-btn calc-btn clear" data-key="D">←</button>
                    <button class="num-btn calc-btn op" data-key="+">+</button>
                    <button class="num-btn calc-btn op" data-key="-">-</button>
                    <button class="num-btn calc-btn op" data-key="=">=</button>
                    <button class="num-btn calc-btn next" id="next-example-btn">Следующий пример</button>
                </div>
            </div>
        </div>

        <div id="game-zone"></div>
    </div>

    <!-- 🗺️ ОРИГИНАЛЬНОЕ МОДАЛЬНОЕ ОКНО КАРТЫ ПРОЕКТА -->
    <div id="map-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#1e293b; padding:20px; border-radius:12px; width:90%; max-width:600px; display:flex; flex-direction:column; gap:10px; border:1px solid #334155;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="color:#38bdf8; font-family:monospace; font-size:16px;">Карта репозитория 🗺️</b>
                <button id="close-map-btn" style="background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">X</button>
            </div>
            <textarea id="map-text-area" readonly style="width:100%; height:300px; background:#0f172a; color:#cbd5e1; font-family:monospace; font-size:11px; padding:10px; box-sizing:border-box; border:1px solid #334155; border-radius:6px; resize:none;"></textarea>
            <div style="display:flex; gap:10px;">
                <button id="copy-map-btn" style="flex:1; background:#3b82f6; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;">Копировать карту 📋</button>
                <!-- ИСПРАВЛЕНО: Добавлена штатная кнопка перехода на страницу синхронизации для ИИ -->
                <a href="ai_sync.html" target="_blank" style="flex:1; background:#22c55e; color:white; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px; text-align:center;">Синхронизация ИИ 🤖🔗</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
