
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Волшебная таблица умножения</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #dff5ff, #f4e7ff, #fff1dc);
    color: #29345c;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 35px 15px 20px;
}

header h1 {
    font-size: clamp(28px, 5vw, 48px);
    margin: 0;
    color: #6548c7;
    text-shadow: 2px 3px 0 white;
}

header p {
    font-size: 18px;
    color: #68749c;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 15px;
}

.section-title {
    text-align: center;
    font-size: 25px;
    margin: 25px 0 15px;
    color: #5141a0;
}

.table-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 5px 14px #7b80aa25;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 9px 20px #7b80aa40;
}

.card h3 {
    margin: 0 0 9px;
    font-size: 23px;
    color: #7355cf;
}

.example {
    font-size: 17px;
    padding: 3px;
    color: #485477;
    font-weight: bold;
}

.example:nth-child(even) {
    color: #ed7597;
}

.card:nth-child(3n) h3 {
    color: #e58b3e;
}

.card:nth-child(3n+1) h3 {
    color: #32a99c;
}

.game {
    background: white;
    border-radius: 25px;
    padding: 25px;
    margin: 35px auto;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 8px 25px #7b80aa30;
}

.game h2 {
    color: #6548c7;
}

.question {
    font-size: 42px;
    font-weight: bold;
    color: #ed7597;
    margin: 20px;
}

input {
    width: 120px;
    padding: 12px;
    border: 3px solid #d8d0fa;
    border-radius: 12px;
    font-size: 24px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #8769e8;
}

button {
    border: none;
    background: linear-gradient(135deg, #8d70ec, #b26de5);
    color: white;
    padding: 13px 25px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

#result {
    font-size: 19px;
    font-weight: bold;
    min-height: 30px;
    margin-top: 15px;
}

.score {
    font-size: 18px;
    color: #32a99c;
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #8991b1;
}

@media(max-width: 700px) {
    .table-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(min-width: 701px) and (max-width: 950px) {
    .table-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>🌈 Волшебная таблица умножения</h1>
    <p>Учись, играй и становись мастером математики! ⭐</p>
</header>

<div class="container">

    <h2 class="section-title">📚 Учим таблицу умножения</h2>

    <div class="table-grid" id="tables"></div>

    <section class="game">
        <h2>🎮 Математическая игра</h2>
        <p>Реши пример и получи звёздочку!</p>

        <div class="question" id="question">2 × 3 = ?</div>

        <input
            type="number"
            id="answer"
            placeholder="?"
            onkeydown="if(event.key==='Enter') checkAnswer()"
        >

        <br>

        <button onclick="checkAnswer()">Проверить ⭐</button>
        <button onclick="newQuestion()">Другой пример 🔄</button>

        <div id="result"></div>
        <div class="score">
            ⭐ Правильных ответов: <span id="score">0</span>
        </div>
    </section>

</div>

<footer>
    Сделано с любовью к математике 💜
</footer>

<script>
const tables = document.getElementById("tables");

for (let i = 1; i <= 10; i++) {
    const card = document.createElement("div");
    card.className = "card";

    let content = `<h3>Таблица на ${i}</h3>`;

    for (let j = 1; j <= 10; j++) {
        content += `
            <div class="example">
                ${i} × ${j} = ${i * j}
            </div>
        `;
    }

    card.innerHTML = content;
    tables.appendChild(card);
}

let a, b;
let score = 0;
let answered = false;

function newQuestion() {
    a = Math.floor(Math.random() * 10) + 1;
    b = Math.floor(Math.random() * 10) + 1;

    answered = false;

    document.getElementById("question").textContent =
        `${a} × ${b} = ?`;

    document.getElementById("answer").value = "";
    document.getElementById("result").textContent = "";
    document.getElementById("answer").focus();
}

function checkAnswer() {
    if (answered) return;

    const input = document.getElementById("answer");
    const value = input.value;

    if (value.trim() === "") {
        document.getElementById("result").textContent =
            "✏️ Сначала введи ответ!";
        return;
    }

    if (Number(value) === a * b) {
        score++;
        answered = true;

        document.getElementById("result").textContent =
            "🎉 Ура! Правильно! Ты молодец!";

        document.getElementById("score").textContent = score;
    } else {
        document.getElementById("result").textContent =
            "😊 Попробуй ещё раз! У тебя получится!";
    }
}

newQuestion();
</script>

</body>
</html>
