name: Auto Sync Project Map for AI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run project mapper
      run: node --experimental-modules js/project_map.js

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add ai_sync.txt
        git diff-index --quiet HEAD || git commit -m "chore: auto-update project map for AI sync [skip ci]"
        git push origin main
