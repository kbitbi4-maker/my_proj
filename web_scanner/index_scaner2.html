<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>QR_TABLE_PRO_25</title>
  <link rel="stylesheet" href="scanner_style.css">
</head>
<body>

  <header class="header">
    <button class="btn-icon" onclick="window.location.href='../index.html'">←</button>
    <h2><div id="indicator" class="net-indicator"></div> QR_25</h2>
    <button class="btn-icon" title="Остатки" onclick="showStock()">📋</button>
    <button id="sync-btn" class="btn-icon" title="Синхронизация" onclick="syncFromGoogle()">☁</button>
    <button id="start-camera" onclick="toggleCamera()">Найти QR</button>
  </header>

  <main class="content">
    <div class="camera-preview"><video id="video" autoplay playsinline></video></div>
    <div id="result">
      <div class="log-title">Журнал выдачи:</div>
      <div class="table-wrapper">
        <table>
          <thead><tr id="logs-head"></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modal" class="modal-overlay hidden">
    <!-- Окно Нумпада -->
    <div class="numpad-container" id="numpad-view">
      <div id="qr-data-display">Товар не выбран</div>
      <div id="numpad-display">0</div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="pressNum(1)">1</button><button class="num-btn" onclick="pressNum(2)">2</button><button class="num-btn" onclick="pressNum(3)">3</button>
        <button class="num-btn" onclick="pressNum(4)">4</button><button class="num-btn" onclick="pressNum(5)">5</button><button class="num-btn" onclick="pressNum(6)">6</button>
        <button class="num-btn" onclick="pressNum(7)">7</button><button class="num-btn" onclick="pressNum(8)">8</button><button class="num-btn" onclick="pressNum(9)">9</button>
        <button class="num-btn" onclick="pressNum(0)">0</button><button class="num-btn" style="grid-column:span 2;background:#ffccbc" onclick="pressNum('C')">СБРОС</button>
      </div>
      <button class="user-btn" style="background:#3f51b5;color:white" onclick="openUserMenu()">КОМУ: <span id="who-label">...</span></button>
      <button id="add-btn" class="btn-add" onclick="saveEntry()">ДОБАВИТЬ 0</button>
      <button class="user-btn" style="background:#f44336;color:white;margin-top:10px" onclick="closeModal()">ОТМЕНА</button>
    </div>

    <!-- Окно Пользователей -->
    <div class="numpad-container hidden" id="user-view">
      <button class="btn-icon" style="color:black;font-weight:bold;justify-content:flex-start;" onclick="closeUserMenu()">← НАЗАД</button>
      <div>
        <button class="user-btn" onclick="selectUser('Головин')">Головин</button>
        <button class="user-btn" onclick="selectUser('Иванов')">Иванов</button>
        <button class="user-btn" onclick="selectUser('Мытин')">Мытин</button>
        <button class="user-btn" onclick="selectUser('Погорелов')">Погорелов</button>
        <button class="user-btn" onclick="selectUser('Гуляев')">Гуляев</button>
        <button class="user-btn" onclick="selectUser('Бывальцев')">Бывальцев</button>
        <button class="user-btn" onclick="selectUser('Божков')">Божков</button>
      </div>
    </div>

    <!-- Окно Остатков (Лист 1) -->
    <div class="numpad-container hidden" id="stock-view">
      <div class="view-header">
        <button class="btn-icon" style="color:#3f51b5; font-weight:bold;" onclick="closeModal()">←</button>
        <h3>Остатки на складе</h3>
      </div>
      
      <input type="text" id="stock-search" placeholder="Поиск..." 
             style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; border:1px solid #ccc; font-size:2.2vh; box-sizing:border-box;"
             oninput="renderStock()"> 

      <div style="overflow:auto;flex-grow:1;border:1px solid #ddd;border-radius:8px;">
        <table>
          <thead><tr id="stock-head"></tr></thead>
          <tbody id="stock-body"></tbody>
        </table>
      </div>
    </div>
  </div>

 <script src="https://unpkg.com"></script>
<!-- Подключаем вынесенный код камеры -->
<script src="js/camera.js"></script>

<script>
  let authUser = "Неугодникова"; 
  let isSaving = false;
  let scanning = false;
  const SCRIPT_URL = 'https://google.com';
  const video = document.getElementById('video');
  const indicator = document.getElementById('indicator');
  const whoLabel = document.getElementById('who-label');
  const numDisplay = document.getElementById('numpad-display');
  const addBtn = document.getElementById('add-btn');

  let qrLogs = JSON.parse(localStorage.getItem('qr_db_v9')) || [];
  let inventoryData = JSON.parse(localStorage.getItem('qr_inventory_v2')) || [];
  
  let currentQR = "", currentQty = "0", currentUser = "Не указан";

  function renderLogs() {
    const head = document.getElementById('logs-head');
    const body = document.getElementById('logs-body');
    if (!qrLogs.length) { body.innerHTML = '<tr><td colspan="11">Пусто</td></tr>'; return; }

    head.innerHTML = qrLogs[0].data.map(h => `<th>${h}</th>`).join('');

    body.innerHTML = qrLogs.slice(1).reverse().map(item => {
      const isSynced = item.status === 'ok';
      const bg = isSynced ? 'style="background:#d4edda;"' : '';
      return `<tr ${bg}>${item.data.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
    }).join('');
  }

  function showStock() {
    if (!inventoryData || inventoryData.length === 0) { alert("Сначала нажмите ☁"); return; }
    
    const searchInput = document.getElementById('stock-search');
    if (searchInput) searchInput.value = "";

    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('numpad-view').classList.add('hidden');
    document.getElementById('stock-view').classList.remove('hidden');
    
    renderStock();
  }

  function renderStock() {
    const head = document.getElementById('stock-head');
    const body = document.getElementById('stock-body');
    const searchInput = document.getElementById('stock-search');
    const term = searchInput ? searchInput.value.toLowerCase() : "";
    
    head.innerHTML = inventoryData[0].map(h => `<th>${h}</th>`).join('');
    
    const filtered = inventoryData.slice(1).filter(row => 
      row.some(cell => String(cell).toLowerCase().includes(term))
    );
    
    body.innerHTML = filtered.map(row => {
      const fullCode = `${row[0]}/${row[1]}/${row[2]}/${row[3]}`; 
      return `<tr onclick="selectFromStock('${fullCode}')">${row.map(c => `<td>${c}</td>`).join('')}</tr>`;
    }).join('');
    
    if (filtered.length === 0) {
      body.innerHTML = '<tr><td colspan="11">Ничего не найдено</td></tr>';
    }
  }

  function selectFromStock(code) { currentQR = code; closeModal(); openModal(); }
  
  function openModal() {
    const qrParts = currentQR.split('/');
    const qrArt = qrParts[0]; 
    const qrParam = qrParts[1]; 

    const foundRow = inventoryData.find(r => 
      String(r[0]) === String(qrArt) && String(r[1]) === String(qrParam)
    );

    const stock = foundRow ? ` (Ост: ${foundRow[4] || '0'})` : " (Ост: ?)";

    document.getElementById('qr-data-display').innerText = "ТОВАР: " + currentQR + stock;
    
    currentQty = "0"; numDisplay.innerText = "0"; currentUser = "Не указан"; whoLabel.innerText = "...";
    addBtn.innerText = "ДОБАВИТЬ 0";
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('numpad-view').classList.remove('hidden');
    document.getElementById('stock-view').classList.add('hidden');
  }

  function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('start-camera').disabled = false; scanning = false; }
  function openUserMenu() { document.getElementById('numpad-view').classList.add('hidden'); document.getElementById('user-view').classList.remove('hidden'); }
  function closeUserMenu() { document.getElementById('user-view').classList.add('hidden'); document.getElementById('numpad-view').classList.remove('hidden'); }
  function selectUser(name) { currentUser = name; whoLabel.innerText = name; addBtn.innerText = `ДОБАВИТЬ ${currentQty} (${currentUser})`; closeUserMenu(); }
  
  function pressNum(n) { 
    if (n==='C') currentQty="0"; 
    else currentQty=currentQty==="0"?String(n):currentQty+n; 
    numDisplay.innerText=currentQty; 
    addBtn.innerText=`ДОБАВИТЬ ${currentQty} (${currentUser})`; 
  }

  async function saveEntry() {
    if (isSaving) return; 
    isSaving = true;

    try {
      const now = new Date(),
            hh = now.getHours().toString().padStart(2,'0'),
            mm = now.getMinutes().toString().padStart(2,'0'),
            time = "'" + hh + ":" + mm,
            day = now.getDate().toString().padStart(2,'0'),
            month = (now.getMonth()+1).toString().padStart(2,'0'),
            year = now.getFullYear().toString().slice(-2);
      
      const authUser = "Неугодников"; 
      const qrParts = currentQR.split('/');
      const nextId = qrLogs.length > 1 ? Math.max(...qrLogs.filter(r => r.status === 'ok' || !isNaN(r.data[0])).map(r => parseInt(r.data[0]) || 0)) + 1 : 1;

      const newRowData = [nextId, ...qrParts, currentQty, currentUser, authUser, time, day, month, year];

      const qty = parseInt(currentQty) || 0;
      inventoryData = inventoryData.map(r => {
        if (String(r[0]) === String(qrParts[0]) && String(r[1]) === String(qrParts[1])) {
          r[4] = (parseInt(r[4]) || 0) - qty;
        }
        return r;
      });

      localStorage.setItem('qr_inventory_v2', JSON.stringify(inventoryData));
      qrLogs.push({ data: newRowData, status: 'wait' });
      localStorage.setItem('qr_db_v9', JSON.stringify(qrLogs));   
      
      renderLogs(); closeModal();
      isSaving = false; sendUnsynced(); 
      
    } catch (e) { console.error(e); isSaving = false; }
  }

  async function sendUnsynced() {
    if (!navigator.onLine) return;
    for (let i = 0; i < qrLogs.length; i++) {
      if (qrLogs[i].status === 'wait') {
        qrLogs[i].status = 'syncing'; 
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ row: qrLogs[i].data })
          });
          qrLogs[i].status = 'ok';
          localStorage.setItem('qr_db_v9', JSON.stringify(qrLogs));
          renderLogs();
        } catch (e) {
          qrLogs[i].status = 'wait'; 
          localStorage.setItem('qr_db_v9', JSON.stringify(qrLogs));
          break; 
        }
      }
    }
  }

  async function syncFromGoogle() {
    if (!navigator.onLine) return;
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      
      if (data.logs) {
        qrLogs = data.logs.map(row => ({ data: row, status: 'ok' }));
        localStorage.setItem('qr_db_v9', JSON.stringify(qrLogs));
      }
      if (data.stock) {
        inventoryData = data.stock;
        localStorage.setItem('qr_inventory_v2', JSON.stringify(inventoryData));
      }
      renderLogs();
    } catch (e) { alert("Ошибка"); }
  }
        
  function updateStatus() { 
    indicator.classList.toggle('net-online', navigator.onLine); 
  }

  window.addEventListener('online', () => {
    updateStatus();
    sendUnsynced(); 
  });

  window.addEventListener('offline', updateStatus);
  
  updateStatus(); 
  renderLogs();
  sendUnsynced();
</script>
</body>
</html>
