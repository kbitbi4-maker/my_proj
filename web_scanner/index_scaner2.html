<!DOCTYPE html> 
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>ВЕБ-СКАНЕР PRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a class="btn-icon" href="../index.html">←</a>
    <h2><div id="indicator" class="net-indicator"></div> PRO_26</h2>
    <button id="return-mode-btn" class="btn-icon" title="Режим возврата" onclick="toggleReturnMode()">🔄</button>
    <!-- НОВАЯ КНОПКА ФАЙЛОВОГО МЕНЕДЖЕРА / ИМПОРТА САЛЬДО -->
    <button class="btn-icon" title="Импорт Excel" onclick="openBalanceMenu()">📊</button>
    <button class="btn-icon" title="Остатки" onclick="showStock()">📋</button>
    <button id="sync-btn" class="btn-icon" title="Синхронизация" onclick="syncFromGoogle()">☁</button>
    <button id="start-camera" onclick="toggleCamera()">Найти QR</button>
  </header>

  <!-- Скрытый инпут для системного выбора файла Excel -->
  <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelImport(event)">

  <main class="content">
    <div class="camera-preview"><video id="video" autoplay playsinline></video></div>
    
    <!-- Журнал выданных товаров -->
    <div id="result">
      <div class="log-title">Журнал выдачи:</div>
      <div class="table-wrapper">
        <table>
          <thead><tr id="logs-head"></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Единое модальное окно для всех подэкранов -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="handleBackButton()">←</button>

      <!-- ЭКРАН 1: Просмотр и поиск остатков -->
      <div id="stock-view" class="hidden">
        <h3>Остатки на складе</h3>
        <input type="text" id="stock-search" oninput="renderStock()" placeholder="Поиск по наименованию или артикулу..." autocomplete="off">
        <div class="table-wrapper modal-table">
          <table>
            <thead><tr id="stock-head"></tr></thead>
            <tbody id="stock-body"></tbody>
          </table>
        </div>
      </div>

      <!-- ЭКРАН 2: Цифровая клавиатура (Нумпад) -->
      <div id="numpad-view" class="hidden">
        <div id="qr-data-display" class="item-info-badge">Товар не выбран</div>
        
        <!-- Левая/Верхняя часть: Ввод данных -->
        <div class="numpad-input-block">
          <div class="numpad-display-row">
            <div id="numDisplay" class="numpad-screen">0</div>
            <div class="numpad-meta-buttons">
              <button id="date-select-btn" class="meta-trigger" onclick="toggleDateMode()">Дата: --.--.--</button>
            </div>
          </div>

          <div class="numpad-grid">
            <button onclick="pressNum(1)">1</button>
            <button onclick="pressNum(2)">2</button>
            <button onclick="pressNum(3)">3</button>
            <button onclick="pressNum(4)">4</button>
            <button onclick="pressNum(5)">5</button>
            <button onclick="pressNum(6)">6</button>
            <button onclick="pressNum(7)">7</button>
            <button onclick="pressNum(8)">8</button>
            <button onclick="pressNum(9)">9</button>
            <button class="btn-clear" onclick="pressNum('C')">C</button>
            <button onclick="pressNum(0)">0</button>
          </div>
        </div>

        <!-- Правая/Нижняя часть: Главные кнопки действий -->
        <div class="numpad-actions">
          <button class="user-select-trigger" onclick="openUserMenu()">
            СОТРУДНИК
            <span id="whoLabel">...</span>
          </button>
          <button id="addBtn" class="btn-submit" onclick="saveEntry()">ДОБАВИТЬ 0</button>
        </div>
      </div>

      <!-- ЭКРАН 3: Выбор сотрудника -->
      <div id="user-view" class="hidden">
        <h3>Выберите сотрудника</h3>
        <div class="user-list-grid">
          <button onclick="selectUser('Головин')">Головин</button>
          <button onclick="selectUser('Иванов')">Иванов</button>
          <button onclick="selectUser('Мытин')">Мытин</button>
          <button onclick="selectUser('Погорелов')">Погорелов</button>
          <button onclick="selectUser('Перепелица')">Перепелица</button>
          <button onclick="selectUser('Гуляев')">Гуляев</button>
          <button onclick="selectUser('Божков')">Божков</button>
          <button onclick="selectUser('Бывальцев')">Бывальцев</button>
          <button class="btn-back" onclick="handleBackButton()">← Назад</button>
        </div>
      </div>

      <!-- ЭКРАН 4: Подтверждение возврата / Действия со строкой журнала -->
      <div id="return-view" class="hidden">
        <h3>Управление выдачей</h3>
        <div id="return-info-badge" class="item-info-badge return-badge">
          Загрузка данных...
        </div>
        <div class="return-actions-grid">
          <button class="btn-return-action return-full" onclick="processReturn('full')">ВОЗВРАТ</button>
          <button class="btn-return-action return-part" onclick="processReturn('part')">ВЕРНУТЬ ЧАСТЬ</button>
          <button class="btn-return-action return-delete" onclick="executePhysicalDeletion()">УДАЛИТЬ СТРОКУ</button>
          <button class="btn-back" onclick="handleBackButton()">← Отмена</button>
        </div>
      </div>

      <!-- НОВЫЙ ЭКРАН 5: Диалоговое окно Сальдо -->
      <div id="balance-view" class="hidden">
        <h3>Управление Сальдо</h3>
        <div class="return-actions-grid" style="margin-top: 20px;">
          <button class="btn-return-action return-full" style="background: #2563eb;" onclick="triggerExcelFileChoice()">ЗАГРУЗИТЬ САЛЬДО</button>
          <button class="btn-return-action return-part" style="background: #7c3aed;" onclick="runCompareAlert()">СРАВНИТЬ</button>
          <button class="btn-back" onclick="handleBackButton()">← Назад</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Внешняя официальная библиотека парсинга Excel файлов -->
  <script src="https://cloudflare.com"></script>
  <script src="js/jsQR.js"></script>
  <script src="js/network.js"></script>
  <script src="js/api.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/numpad.js"></script>
  <script src="js/save.js"></script>
  <script src="js/returns.js"></script>
  <script src="js/delete_task.js"></script>
  <script src="js/edit_stock.js"></script>
  <!-- ПОДКЛЮЧАЕМ НАШ НОВЫЙ МОДУЛЬ САЛЬДО -->
  <script src="js/balance.js"></script>

</body>
</html>
