<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>QR_TABLE_PRO_25</title>
  <!-- Подключаем внешние стили -->
  <link rel="stylesheet" href="scanner_style.css">
</head>
<body>

  <header class="header">
    <button class="btn-icon" onclick="window.location.href='../index.html'">←</button>
    <h2><div id="indicator" class="net-indicator"></div> QR_25</h2>
    <button class="btn-icon" title="Остатки" onclick="showStock()">📋</button>
    <button id="sync-btn" class="btn-icon" title="Синхронизация" onclick="syncFromGoogle()">☁</button>
    <button id="start-camera" onclick="toggleCamera()">Найти QR</button>
  </header>

  <main class="content">
    <div class="camera-preview"><video id="video" autoplay playsinline></video></div>
    <div id="result">
      <div class="log-title">Журнал выдачи:</div>
      <div class="table-wrapper">
        <table>
          <thead><tr id="logs-head"></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modal" class="modal-overlay hidden">
    <!-- Окно Нумпада -->
    <div class="numpad-container" id="numpad-view">
      <div id="qr-data-display">Товар не выбран</div>
      <div id="numpad-display">0</div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="pressNum(1)">1</button><button class="num-btn" onclick="pressNum(2)">2</button><button class="num-btn" onclick="pressNum(3)">3</button>
        <button class="num-btn" onclick="pressNum(4)">4</button><button class="num-btn" onclick="pressNum(5)">5</button><button class="num-btn" onclick="pressNum(6)">6</button>
        <button class="num-btn" onclick="pressNum(7)">7</button><button class="num-btn" onclick="pressNum(8)">8</button><button class="num-btn" onclick="pressNum(9)">9</button>
        <button class="num-btn" onclick="pressNum(0)">0</button><button class="num-btn" style="grid-column:span 2;background:#ffccbc" onclick="pressNum('C')">СБРОС</button>
      </div>
      <button class="user-btn" style="background:#3f51b5;color:white" onclick="openUserMenu()">КОМУ: <span id="who-label">...</span></button>
      <button id="add-btn" class="btn-add" onclick="saveEntry()">ДОБАВИТЬ 0</button>
      <button class="user-btn" style="background:#f44336;color:white;margin-top:10px" onclick="closeModal()">ОТМЕНА</button>
    </div>

    <!-- Окно Пользователей -->
    <div class="numpad-container hidden" id="user-view">
      <button class="btn-icon" style="color:black;font-weight:bold;justify-content:flex-start;" onclick="closeUserMenu()">← НАЗАД</button>
      <div>
        <button class="user-btn" onclick="selectUser('Головин')">Головин</button>
        <button class="user-btn" onclick="selectUser('Иванов')">Иванов</button>
        <button class="user-btn" onclick="selectUser('Мытин')">Мытин</button>
        <button class="user-btn" onclick="selectUser('Погорелов')">Погорелов</button>
        <button class="user-btn" onclick="selectUser('Гуляев')">Гуляев</button>
        <button class="user-btn" onclick="selectUser('Бывальцев')">Бывальцев</button>
        <button class="user-btn" onclick="selectUser('Божков')">Божков</button>
      </div>
    </div>

    <!-- Окно Остатков -->
    <div class="numpad-container hidden" id="stock-view">
      <div class="view-header">
        <button class="btn-icon" style="color:#3f51b5; font-weight:bold;" onclick="closeModal()">←</button>
        <h3>Остатки на складе</h3>
      </div>
      
      <input type="text" id="stock-search" placeholder="Поиск..." 
             style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; border:1px solid #ccc; font-size:2.2vh; box-sizing:border-box;"
             oninput="renderStock()"> 

      <div style="overflow:auto;flex-grow:1;border:1px solid #ddd;border-radius:8px;">
        <table>
          <thead><tr id="stock-head"></tr></thead>
          <tbody id="stock-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Внешние библиотеки и модули -->
  <script src="https://unpkg.com"></script>
  <script src="js/camera.js"></script>

  <script>
    // Глобальные флаги состояния для синхронизации модулей
    let authUser = "Неугодникова"; 
    let isSaving = false;
    let scanning = false; 
  </script>

  <!-- Новое местоположение ядра логики приложения -->
  <script src="js/scanner_core.js"></script>
</body>
</html>
