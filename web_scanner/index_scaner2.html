<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>ВЕБ-СКАНЕР PRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a class="btn-icon" href="../index.html">←</a>
    <h2><div id="indicator" class="net-indicator"></div> PRO_26</h2>
    <button class="btn-icon" title="Остатки" onclick="showStock()">📋</button>
    <button id="sync-btn" class="btn-icon" title="Синхронизация" onclick="syncFromGoogle()">☁</button>
    <button id="start-camera" onclick="toggleCamera()">Найти QR</button>
  </header>

  <main class="content">
    <div class="camera-preview"><video id="video" autoplay playsinline></video></div>
    
    <!-- НОВАЯ ОБЛАСТЬ: Журнал выданных товаров (как в Excel) -->
    <div id="result">
      <div class="log-title">Журнал выдачи:</div>
      <div class="table-wrapper">
        <table>
          <thead><tr id="logs-head"></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/jsQR.js"></script>
  <script src="js/network.js"></script>
  <script src="js/api.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/numpad.js"></script>
  <script src="js/save.js"></script>

</body>
</html>
