<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>QR_TABLE_PRO_25 (Модульный)</title>
  <!-- Подключаем внешние стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Шапка приложения -->
  <header class="header">
    <button class="btn-icon" onclick="window.location.href='../index.html'">←</button>
    <h2><div id="indicator" class="net-indicator"></div> QR_25</h2>
    <button class="btn-icon" title="Остатки" onclick="UI.showStock()">📋</button>
    <button id="sync-btn" class="btn-icon" title="Синхронизация" onclick="Network.syncFromGoogle()">☁</button>
    <!-- Вызывает оригинальную функцию напрямую -->
    <button id="start-camera" onclick="toggleCamera()">Найти QR</button>
  </header>

  <!-- Основной контент: Видеострим и Журнал -->
  <main class="content">
    <div class="camera-preview"><video id="video" autoplay playsinline></video></div>
    <div id="result">
      <div class="log-title">Журнал выдачи:</div>
      <div class="table-wrapper">
        <table>
          <thead><tr id="logs-head"></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Общий контейнер для модальных окон -->
  <div id="modal" class="modal-overlay hidden">
    
    <!-- Модальное окно 1: Ввод количества (Нумпад) -->
    <div class="numpad-container hidden" id="numpad-view">
      <div id="qr-data-display">Товар не выбран</div>
      <div id="numpad-display">0</div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="Numpad.press(1)">1</button>
        <button class="num-btn" onclick="Numpad.press(2)">2</button>
        <button class="num-btn" onclick="Numpad.press(3)">3</button>
        <button class="num-btn" onclick="Numpad.press(4)">4</button>
        <button class="num-btn" onclick="Numpad.press(5)">5</button>
        <button class="num-btn" onclick="Numpad.press(6)">6</button>
        <button class="num-btn" onclick="Numpad.press(7)">7</button>
        <button class="num-btn" onclick="Numpad.press(8)">8</button>
        <button class="num-btn" onclick="Numpad.press(9)">9</button>
        <button class="num-btn" onclick="Numpad.press(0)">0</button>
        <button class="num-btn clear-btn" onclick="Numpad.press('C')">СБРОС</button>
      </div>
      <button class="user-btn primary-user-btn" onclick="UI.openUserMenu()">КОМУ: <span id="who-label">...</span></button>
      <button id="add-btn" class="btn-add" onclick="DB.saveEntry()">ДОБАВИТЬ 0</button>
      <button class="user-btn danger-user-btn" onclick="UI.closeModal()">ОТМЕНА</button>
    </div>

    <!-- Модальное окно 2: Выбор сотрудника -->
    <div class="numpad-container hidden" id="user-view">
      <button class="btn-icon back-btn" onclick="UI.closeUserMenu()">← НАЗАД</button>
      <div id="users-list-container"></div>
    </div>

    <!-- Модальное окно 3: Просмотр и поиск остатков -->
    <div class="numpad-container hidden" id="stock-view">
      <div class="view-header">
        <button class="btn-icon" onclick="UI.closeModal()">←</button>
        <h3>Остатки на складе</h3>
      </div>
      <input type="text" id="stock-search" placeholder="Поиск..." oninput="UI.renderStock()"> 
      <div class="stock-table-scroll">
        <table>
          <thead><tr id="stock-head"></tr></thead>
          <tbody id="stock-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Оверлей авторизации -->
  <div id="auth-overlay" class="modal-overlay hidden">
    <div class="login-card">
      <h2>Склад ПРО</h2>
      <select id="auth-user-select"></select>
      <input type="password" id="auth-pin-input" placeholder="ПИН-код" inputmode="numeric">
      <button id="auth-submit-btn">ВОЙТИ</button>
    </div>
  </div>

  <!-- Внешние библиотеки -->
  <script src="https://unpkg.com"></script>
  
  <!-- Инициализируем глобальные переменные для совместимости с оригинальным кодом камеры -->
  <script>
    window.video = document.getElementById('video');
    window.currentQR = "";
  </script>

  <!-- Скрипты ядра и модули -->
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/numpad.js"></script>
  <script src="js/db.js"></script>
  <script src="js/network.js"></script>
  <script src="js/camera.js"></script> <!-- Сюда вставляется ваш неизмененный рабочий код -->
  <script src="js/app.js"></script>

  <!-- Глобальный мост-связка для оригинального скрипта -->
  <script>
    function openModal() {
      Numpad.open(false);
    }
  </script>
</body>
</html>
