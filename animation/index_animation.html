<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиксельная Лаборатория Анимации</title>
    <link rel="stylesheet" href="style_animation.css">
</head>
<body>

    <div class="header">
        <a href="../index.html" class="back-btn">←</a>
        <h1>Проект PR5: Пиксельная Лаборатория Анимации</h1>
    </div>

    <div class="main-container">
        <!-- Левая панель: Инструменты и Кадры -->
        <div class="left-panel">
            <p class="section-title">Авто-Сканирование 📷</p>
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <input type="file" id="imageImporter" accept="image/*" style="display: none;">
                <button class="btn btn-success" id="uploadTriggerBtn" style="font-size: 0.85rem; padding: 8px;">Импорт картинки</button>
            </div>

            <p class="section-title" style="margin-top: 5px;">Размерность сетки</p>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Ширина (W):</label>
                    <input type="number" id="gridWidthInput" value="40" min="8" max="100" style="width: 50px; background: #1e1e24; color: #fff; border: 1px solid #3f3f50; padding: 4px; border-radius: 4px;">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Высота (H):</label>
                    <input type="number" id="gridHeightInput" value="40" min="8" max="100" style="width: 50px; background: #1e1e24; color: #fff; border: 1px solid #3f3f50; padding: 4px; border-radius: 4px;">
                </div>
                <button class="btn" id="applyGridSizeBtn" style="padding: 6px; font-size: 0.8rem; margin-top: 2px;">Применить размер</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;">
                <label style="font-size: 0.8rem; color: #94a3b8;">Зум холста: <span id="zoomVal">100%</span></label>
                <input type="range" id="zoomSlider" min="50" max="200" value="100" style="width: 100%;">
            </div>

            <p class="section-title" style="margin-top: 5px;">Экспорт 💾</p>
            <button class="btn" id="exportAnimBtn" style="background: #8a2be2; font-size: 0.85rem; padding: 8px;">Скачать код (.js)</button>

            <p class="section-title" style="margin-top: 5px;">Инструменты</p>
            <div class="color-picker-wrapper">
                <input type="color" id="colorPicker" value="#a78bfa">
                <span>Выбор цвета</span>
            </div>
            <button class="btn btn-danger" id="clearGridBtn">Очистить холст</button>

            <p class="section-title" style="margin-top: 5px;">Кадры</p>
            <div class="frames-list" id="framesList"></div>
            <button class="btn" id="addFrameBtn">+ Добавить кадр</button>
        </div>

        <!-- Центр: Сетка для рисования -->
        <div class="canvas-area">
            <div id="canvasScrollWrapper" style="overflow: auto; max-width: 100%; max-height: 100%; display: flex; justify-content: center; align-items: center;">
                <canvas id="paintCanvas" width="400" height="400"></canvas>
            </div>
        </div>

        <!-- Правая панель: Плеер -->
        <div class="right-panel">
            <p class="section-title">Предпросмотр</p>
            <div class="preview-box">
                <canvas id="previewCanvas" width="128" height="128"></canvas>
            </div>
            <button class="btn btn-success" id="playBtn">Запустить ▷</button>
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="fpsSlider" style="font-size: 0.8rem; color: #94a3b8;">Скорость (FPS): <span id="fpsVal">6</span></label>
                <input type="range" id="fpsSlider" min="1" max="12" value="6" style="width: 100%;">
            </div>

            <p class="section-title" style="margin-top: 5px;">Консоль кода кадра</p>
            <textarea id="frameConsole" placeholder="Здесь отображается код пикселей..."></textarea>
            <button class="btn btn-success" id="applyCodeBtn" style="font-size: 0.85rem; padding: 6px;">Применить код 🛠️</button>
        </div>
    </div>

    <script type="module" src="js/main_editor.js"></script>
</body>
</html>
